name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # =========================================================================
  # Job 1: Code Quality Check
  # =========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          pip install ruff mypy black isort

      - name: Run Ruff (linting)
        run: |
          ruff check src/ tests/ || true

      - name: Run Black (format check)
        run: |
          black --check src/ tests/ || true

      - name: Run MyPy (type check)
        run: |
          mypy src/ --ignore-missing-imports || true

  # =========================================================================
  # Job 2: Unit Tests
  # =========================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # =========================================================================
  # Job 3: Security Scan
  # =========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install security tools
        run: |
          pip install safety bandit pip-audit

      - name: Run Safety (vulnerability check)
        run: |
          safety check --json || true

      - name: Run Bandit (security lint)
        run: |
          bandit -r src/ -f json -o bandit_report.json || true

      - name: Run Pip Audit
        run: |
          pip-audit || true

  # =========================================================================
  # Job 4: Integration Tests
  # =========================================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download test data
        run: |
          mkdir -p dengue_dataset
          # Create synthetic test data if real data not available
          python -c "
          import numpy as np
          import pandas as pd
          np.random.seed(42)
          n = 1000
          pd.DataFrame({
              'lat': np.random.uniform(-6, 23, n),
              'lon': np.random.uniform(95, 141, n),
              'timestamp': pd.date_range('2020-01-01', periods=n, freq='h'),
              'case_count': np.random.randint(0, 50, n)
          }).to_csv('dengue_dataset/test_events.csv', index=False)
          "

      - name: Run integration tests
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from data.loader import create_adaptive_spatial_grid
          import pandas as pd
          df = pd.read_csv('dengue_dataset/test_events.csv')
          grid, _, _, _, _ = create_adaptive_spatial_grid(df, grid_size=16)
          assert grid.shape[0] == 16
          print('Integration test passed!')
          "

  # =========================================================================
  # Job 5: Build Docker Image
  # =========================================================================
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
        if: github.event_name != 'pull_request'

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/quantum-dengue:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/quantum-dengue:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # Job 6: Deploy to Staging (on master push)
  # =========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.quantum-dengue.example.com
    steps:
      - name: Deploy notification
        run: |
          echo "Deploying to staging environment..."
          echo "Docker image: ${{ secrets.DOCKER_USERNAME }}/quantum-dengue:${{ github.sha }}"

  # =========================================================================
  # Job 7: Performance Benchmark
  # =========================================================================
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-benchmark

      - name: Run benchmarks
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          import time
          import torch
          from models.cnn_lstm import SpatioTemporalCNN
          
          # Warm up
          model = SpatioTemporalCNN(grid_size=20, output_activation='softplus')
          x = torch.randn(4, 12, 20, 20)
          for _ in range(3):
              model(x)
          
          # Benchmark
          times = []
          for _ in range(100):
              start = time.time()
              model(x)
              times.append(time.time() - start)
          
          print(f'Mean inference time: {sum(times)/len(times)*1000:.2f}ms')
          print(f'Min: {min(times)*1000:.2f}ms, Max: {max(times)*1000:.2f}ms')
          "

  # =========================================================================
  # Summary
  # =========================================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security, integration-test, docker, benchmark]
    if: always()
    steps:
      - name: Test Summary
        run: |
          echo "## CI/CD Pipeline Summary"
          echo "==============="
          echo "- Lint: ${{ needs.lint.result }}"
          echo "- Tests: ${{ needs.test.result }}"
          echo "- Security: ${{ needs.security.result }}"
          echo "- Integration: ${{ needs.integration-test.result }}"
          echo "- Docker: ${{ needs.docker.result }}"
          echo "- Benchmark: ${{ needs.benchmark.result }}"
